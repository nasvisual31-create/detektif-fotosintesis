<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sun-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>
    <radialGradient id="center-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="100" fill="url(#sun-bg)"/>
  
  <!-- Green Leaves -->
  <ellipse cx="170" cy="330" rx="75" ry="45" fill="#15803d" transform="rotate(-25 170 330)"/>
  <ellipse cx="342" cy="330" rx="75" ry="45" fill="#15803d" transform="rotate(25 342 330)"/>
  
  <!-- Sunflower Petals -->
  <g id="petals" transform="translate(256, 240)">
    <g id="petal-pair">
      <ellipse cx="0" cy="-140" rx="25" ry="68" fill="#facc15" stroke="#eab308" stroke-width="3"/>
      <ellipse cx="0" cy="140" rx="25" ry="68" fill="#facc15" stroke="#eab308" stroke-width="3"/>
    </g>
    <use href="#petal-pair" transform="rotate(22.5)"/>
    <use href="#petal-pair" transform="rotate(45)"/>
    <use href="#petal-pair" transform="rotate(67.5)"/>
    <use href="#petal-pair" transform="rotate(90)"/>
    <use href="#petal-pair" transform="rotate(112.5)"/>
    <use href="#petal-pair" transform="rotate(135)"/>
    <use href="#petal-pair" transform="rotate(157.5)"/>
  </g>
  
  <!-- Center Flower Disk -->
  <circle cx="256" cy="240" r="88" fill="url(#center-disk)"/>
  <circle cx="256" cy="240" r="56" fill="#92400e" opacity="0.6"/>
  
  <!-- Happy Eyes & Smile -->
  <ellipse cx="230" cy="225" rx="8" ry="11" fill="#fef08a"/>
  <ellipse cx="282" cy="225" rx="8" ry="11" fill="#fef08a"/>
  <path d="M 230 250 Q 256 275 282 250" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
</svg>
